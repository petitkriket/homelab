machine:
  install:
    disk: /dev/sda
  network:
    nameservers:
      - 192.168.1.1
      - 1.1.1.1
    interfaces:
      - deviceSelector:
          physical: true      # matche la seule carte réseau, évite le piège du nom eth0/ens18
        dhcp: false
        addresses:
          - 192.168.1.86/24
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.1.1
        vip:
          ip: 192.168.1.50    # VIP = endpoint stable, portée par le CP