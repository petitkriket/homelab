machine:
  install:
    disk: /dev/sda
  network:
    nameservers:
      - 192.168.1.1
      - 1.1.1.1
    interfaces:
      - deviceSelector:
          physical: true
        dhcp: false
        addresses:
          - 192.168.1.87/24
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.1.1
