apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: default-lan-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.1.60-192.168.1.70
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: default-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - default-lan-pool
